[project]
name = "routeforge"
version = "0.1.0"
description = "State-aware electric multi-compartment routing with auditable constraints."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
]

[project.scripts]
routeforge = "routeforge.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/routeforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/routeforge/report.py" = ["E501"]
"src/routeforge/app/main.py" = ["E501", "E701"]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
]
